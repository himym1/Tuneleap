# Local / VPS scaffold only. Does not mount NAS music volumes.
services:
  navidrome-cloud:
    build: .
    image: navidrome-cloud:local
    container_name: navidrome-cloud
    ports:
      - "8600:8600"
    env_file:
      - .env
    volumes:
      - ./releases:/app/releases:ro
      - ./data:/app/data
    restart: unless-stopped
