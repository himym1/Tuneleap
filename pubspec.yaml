name: navidrome_player
description: "A Flutter-based Navidrome music player client supporting Subsonic API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  dio: ^5.9.2
  crypto: ^3.0.7
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  cached_network_image: ^3.4.1
  go_router: ^17.1.0
  window_manager: ^0.5.1
  shared_preferences: ^2.5.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  palette_generator: ^0.3.3
  flutter_secure_storage: ^10.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/theme/app_colors.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F0F23"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F0F23"
