flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#101214"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"
